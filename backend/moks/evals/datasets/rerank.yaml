name: rerank
kind: rerank
description: >-
  Reranking compared with the existing order, on the same questions and authorized candidates. Documents and questions
  are synthetic and were written before any model output was seen. Nothing was tuned on them, but they are not real
  operator questions, so a result here is a reason to test further and not proof.
rollout:   # all of these must hold, plus every safety gate, before reranking is eligible
  min_ndcg_gain: 0.02
  min_mrr_gain: 0.02
  max_recall_loss: 0.0
  max_diversity_loss: 0.02
  max_added_p95_ms: 300
bindings:
  reader: [["investigator", "prod", "platform"]]
documents:
  - {id: crashloop, path: runbooks/kubernetes/crashloop.md, text: "# Pods restarting repeatedly\nA pod in CrashLoopBackOff is a container that keeps exiting. Read the previous container's logs with kubectl logs --previous, then check the exit code and recent config changes."}
  - {id: imagepull, path: runbooks/kubernetes/image-pull.md, text: "# Image pull failures\nImagePullBackOff means the kubelet could not fetch the image. Check the tag exists, then the pull secret. On Minikube the ECR token expires after twelve hours unless the refresher runs."}
  - {id: oom, path: runbooks/kubernetes/oom.md, text: "# Containers killed for memory\nExit code 137 with reason OOMKilled means the container went past its memory limit. Compare working set with the limit before raising it, because a leak will reach any limit."}
  - {id: pending, path: runbooks/kubernetes/pending.md, text: "# Pods stuck pending\nA Pending pod has not been scheduled. Read its events: insufficient cpu or memory, taints, node selectors and unbound persistent volume claims are the usual reasons."}
  - {id: readiness, path: runbooks/kubernetes/readiness.md, text: "# Readiness probe failures\nA pod that runs but is not ready gets no traffic. The Service has no endpoints when every pod fails its readiness probe, and the ingress then answers 503."}
  - {id: dns, path: runbooks/kubernetes/dns.md, text: "# Cluster DNS\nIntermittent name resolution failures usually come from CoreDNS pods under CPU pressure. Check the coredns logs and the ndots setting before blaming the application."}
  - {id: selector, path: runbooks/kubernetes/service-selector.md, text: "# Service with no endpoints\nIf a Service's selector matches no pod labels it has no endpoints, and callers get connection refused. Compare the selector with the pod template labels after a rename."}
  - {id: netpol, path: runbooks/kubernetes/network-policy.md, text: "# Connections dropped by NetworkPolicy\nTimeouts between namespaces after a policy change usually mean an egress rule is missing. Note that kindnet may not enforce policies, so a test passing there proves little."}
  - {id: irsa, path: runbooks/aws/irsa.md, text: "# Pod cannot assume its IAM role\nAccessDenied on sts:AssumeRoleWithWebIdentity means the trust policy does not match the service account subject or the OIDC provider. Compare the sub claim with the role's condition."}
  - {id: pod-identity, path: runbooks/aws/pod-identity.md, text: "# EKS Pod Identity\nCredentials come from the association between a service account and a role. If AWS_ACCESS_KEY_ID is set in the pod, it outranks Pod Identity, and calls run as that key instead."}
  - {id: s3-denied, path: runbooks/aws/s3-access.md, text: "# S3 access denied\nA 403 from S3 with a valid identity is usually a bucket policy or a KMS key policy. Check the key policy when objects are encrypted with a customer managed key."}
  - {id: ecr-denied, path: runbooks/aws/ecr-permissions.md, text: "# ECR pull permissions\nAn image pull role needs ecr:GetAuthorizationToken on all resources, and ecr:BatchGetImage on the repository."}
  - {id: argo-path, path: runbooks/argocd/path-missing.md, text: "# Application path does not exist\nArgo CD reports ComparisonError when spec.source.path no longer exists at the target revision. This happens after a repository reorganization: update the Application and re-apply it."}
  - {id: argo-shared, path: runbooks/argocd/shared-resource.md, text: "# SharedResourceWarning and FailOnSharedResource\nTwo Applications that claim one resource fail to sync when FailOnSharedResource is set. Clear the old tracking annotation before the new Application adopts it."}
  - {id: argo-sync, path: runbooks/argocd/out-of-sync.md, text: "# Application stays OutOfSync\nAn Application that never settles usually has a field a controller rewrites. Add ignoreDifferences for that field rather than syncing in a loop."}
  - {id: argo-project, path: runbooks/argocd/project-denied.md, text: "# Project denies a resource\nSync fails with resource not permitted when the AppProject whitelist lacks that kind. deploy-argocd.sh does not update an existing AppProject, so apply it by hand."}
  - {id: rollback-new, path: runbooks/deploy/rollback.md, text: "# Rolling back a deployment\nRevert the commit in Git and let Argo CD sync. A manual kubectl rollout undo is overwritten at the next sync."}
  - {id: rollback-old, path: runbooks/deploy/rollback-legacy.md, text: "---\nsuperseded_by: runbooks/deploy/rollback.md\n---\n# Rolling back a deployment\nRun kubectl rollout undo against the deployment and record the revision in the change log."}
  - {id: pg-conn, path: runbooks/db/postgres-connections.md, text: "# PostgreSQL connection exhaustion\nFATAL too many connections means max_connections is reached. Look for a pool that grew after a replica increase before raising the limit."}
  - {id: pg-disk, path: runbooks/db/postgres-disk.md, text: "# PostgreSQL volume full\nWhen the data volume fills, writes stop with no space left on device. Hostpath volumes on Minikube share the node disk, so a noisy neighbour can fill it."}
  - {id: opensearch-disk, path: runbooks/search/opensearch-watermark.md, text: "# OpenSearch refuses index creation\nAbove the 90 percent flood stage watermark OpenSearch blocks index creation with a 403. The block lifts by itself below the watermark."}
  - {id: cert, path: runbooks/tls/cert-renewal.md, text: "# Certificate renewal failures\nA cert-manager Certificate that stays not ready usually has a failed ACME challenge. Read the Order and Challenge resources, and check the DNS token's permissions."}
  - {id: loki-limits, path: runbooks/observability/loki-limits.md, text: "# Loki rejecting logs\n429 from Loki means the ingestion rate limit was reached. Find the noisy stream rather than raising the limit."}
  - {id: prom-targets, path: runbooks/observability/prometheus-targets.md, text: "# Prometheus target down\nA scrape target that is down shows up=0. A NetworkPolicy or a wrong metrics port is the usual reason, and the service itself may be healthy."}
  - {id: long-tail, path: runbooks/payments/ledger-reconciliation.md, text: "# Ledger reconciliation\nBackground on the nightly job follows. The nightly reconciliation job compares ledger entries with settlement files from each bank and records differences for finance to review in batch 0. The nightly reconciliation job compares ledger entries with settlement files from each bank and records differences for finance to review in batch 1. The nightly reconciliation job compares ledger entries with settlement files from each bank and records differences for finance to review in batch 2. The nightly reconciliation job compares ledger entries with settlement files from each bank and records differences for finance to review in batch 3. The nightly reconciliation job compares ledger entries with settlement files from each bank and records differences for finance to review in batch 4. The nightly reconciliation job compares ledger entries with settlement files from each bank and records differences for finance to review in batch 5. The nightly reconciliation job compares ledger entries with settlement files from each bank and records differences for finance to review in batch 6. The nightly reconciliation job compares ledger entries with settlement files from each bank and records differences for finance to review in batch 7. The nightly reconciliation job compares ledger entries with settlement files from each bank and records differences for finance to review in batch 8. The nightly reconciliation job compares ledger entries with settlement files from each bank and records differences for finance to review in batch 9. The nightly reconciliation job compares ledger entries with settlement files from each bank and records differences for finance to review in batch 10. The nightly reconciliation job compares ledger entries with settlement files from each bank and records differences for finance to review in batch 11. The nightly reconciliation job compares ledger entries wi