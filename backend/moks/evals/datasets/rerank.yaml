  - {id: conflict-a, path: runbooks/cache/redis-failover-a.md, service: redis, text: "# Redis failover\nPromote the replica with REPLICAOF NO ONE, then point the Service at the new primary."}
  - {id: conflict-b, path: runbooks/cache/redis-failover-b.md, service: redis, text: "# Redis failover\nNever promote by hand. Sentinel promotes the replica, so wait for quorum and only restart clients."}
  - {id: errcode, path: runbooks/payments/errors.md, text: "# Payment error codes\nERR_PAY_4071 means the ledger refused the batch because its signature expired."}
  - {id: other-team, namespace: team-secret, path: runbooks/secrets/crashloop-private.md, text: "# Pods restarting repeatedly in the secret team\nCrashLoopBackOff previous logs exit code config changes, a perfect keyword match for the restart question, in a namespace the reader cannot see."}
cases:
  # Kubernetes errors, in operators' words rather than the document's.
  - {id: k8s-restart, category: kubernetes, query: "my container keeps dying and coming back over and over", relevant: [crashloop]}
  - {id: k8s-exit137, category: kubernetes, query: "pod terminated with exit code 137", relevant: [oom]}
  - {id: k8s-notscheduled, category: kubernetes, query: "pods are not being scheduled onto any node", relevant: [pending]}
  - {id: k8s-503, category: kubernetes, query: "ingress returns 503 even though the pods are running", relevant: [readiness, selector]}
  - {id: k8s-registry, category: kubernetes, query: "kubelet cannot fetch the container image from the registry", relevant: [imagepull]}
  - {id: k8s-names, category: kubernetes, query: "services sometimes fail to resolve hostnames inside the cluster", relevant: [dns]}
  - {id: k8s-timeouts, category: kubernetes, query: "requests between namespaces started timing out after a policy change", relevant: [netpol]}
  # AWS identity.
  - {id: aws-webidentity, category: aws_identity, query: "AccessDenied calling sts:AssumeRoleWithWebIdentity from a pod", relevant: [irsa]}
  - {id: aws-wrong-identity, category: aws_identity, query: "why are my pod's AWS calls running as a static access key and not its role", relevant: [pod-identity]}
  - {id: aws-kms, category: aws_identity, query: "getting 403 reading an encrypted object from the bucket", relevant: [s3-denied]}
  # Argo CD.
  - {id: argo-comparison, category: argocd, query: "ComparisonError path does not exist after we moved the folders", relevant: [argo-path]}
  - {id: argo-two-owners, category: argocd, query: "sync fails because two apps own the same resource", relevant: [argo-shared]}
  - {id: argo-loop, category: argocd, query: "the app never settles and keeps showing out of sync", relevant: [argo-sync]}
  - {id: argo-denied, category: argocd, query: "resource kind is not permitted in the project during sync", relevant: [argo-project]}
  # Similar but irrelevant: the words overlap with a neighbour that is not the answer.
  - {id: similar-disk-pg, category: similar, query: "database writes stopped, no space left on device", relevant: [pg-disk]}
  - {id: similar-disk-os, category: similar, query: "search cluster refuses to create an index with a 403", relevant: [opensearch-disk]}
  - {id: similar-429, category: similar, query: "log shipping fails with 429 from the backend", relevant: [loki-limits]}
  - {id: similar-ecr, category: similar, query: "which iam actions does a role need to pull from ecr", relevant: [ecr-denied]}
  - {id: similar-up, category: similar, query: "scrape target shows up equals zero but the service looks fine", relevant: [prom-targets]}
  - {id: similar-pg, category: similar, query: "too many connections error from postgres", relevant: [pg-conn]}
  - {id: similar-cert, category: similar, query: "certificate is not ready and the acme challenge failed", relevant: [cert]}
  # Stale and conflicting documents.
  - {id: stale-rollback, category: stale, query: "how do I roll back a bad deployment", relevant: [rollback-new]}
  - {id: conflict-redis, category: conflict, query: "how do I fail over redis", relevant: [conflict-a, conflict-b]}
  # The answer sits past the part of a long passage the model can read.
  - {id: long-passage, category: long_passage, query: "reconciliation batch stalled on a poison message", relevant: [long-tail]}
  # Exact identifiers.
  - {id: exact-code, category: exact, query: "ERR_PAY_4071", relevant: [errcode], exact: true}
  - {id: exact-flag, category: exact, query: "FailOnSharedResource", relevant: [argo-shared], exact: true}
  # Unauthorized, highly relevant.
  - {id: forbidden-match, category: authorization, query: "pods restarting repeatedly CrashLoopBackOff previous logs exit code config changes", forbidden: [other-team], relevant: [crashloop]}
  # Nothing should answer these.
  - {id: none-identifier, category: no_answer, query: "ERR_NOPE_9999", no_answer: true}
  - {id: none-unrelated, category: no_answer, query: "quarterly marketing budget forecast", no_answer: true}
  - {id: none-empty, category: no_answer, query: "zzzz qqqq", no_answer: true}
