[project]
name = "moks"
version = "0.1.0"
description = "MOKS: AI-assisted SRE investigation and remediation portal"
requires-python = ">=3.11"
# Exact pins live in requirements.txt (used by the image); these are the supported ranges.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "anthropic>=2.3,<3",
  "langchain-core>=1.7,<2",
  "langgraph>=1.2,<2",
  "kubernetes_asyncio>=30",
  "authlib>=1.3",
  "argon2-cffi>=23",
  "prometheus-client>=0.20",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-httpx>=0.46b0",
  "boto3>=1.34",
  "cryptography>=43",
  "pyyaml>=6",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
moks = "moks.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["moks*"]

[tool.setuptools.package-data]
moks = ["migrations/*.py", "migrations/versions/*.py", "migrations/script.py.mako", "skills/builtin/*/SKILL.md", "evals/datasets/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
