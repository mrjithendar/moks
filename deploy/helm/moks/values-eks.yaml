# roboshop-demo (EKS, 2 t4g.large arm64 nodes) behind Istio at https://eks.jithendar.com/moks
image:
  repository: 881026659929.dkr.ecr.us-east-1.amazonaws.com/moks
  # Same release flow as mk4: CI moves latest, and pods get it when they restart (docs/RELEASES.md).
  tag: latest
  pullPolicy: Always
imagePullSecrets: []    # nodes pull from ECR with their node role

publicUrl: https://eks.jithendar.com/moks
basePath: /moks

config:
  env: production
  # local: email + password; closed until you run `moks create-user` (docs/OPERATOR_GUIDE.md).
  authMode: local
  bootstrapAdmins: ""

seed:
  environments:
    - name: roboshop-demo
      display_name: RoboShop EKS (roboshop-demo)
      kind: eks
      is_default: true
      is_production: true
      allowed_namespaces: ["*"]
      denied_namespaces: []
      max_query_window_minutes: 360
      connectors:
        - type: kubernetes
          name: in-cluster
          config: {mode: in_cluster, timeout_seconds: 15, executor: {mode: in_cluster}}
        # Mesh metrics only, 6 h retention, from tools/eks-argocd/platform/kiali-prometheus.yaml. The
        # prometheus-agent in monitoring cannot be queried, and this cluster has no Loki.
        - type: prometheus
          name: prometheus
          config: {base_url: "http://kiali-prometheus-server.istio-system.svc.cluster.local", timeout_seconds: 15}
        - type: git
          name: github
          config: {provider: github, repositories: [mrjithendar/moks, mrjithendar/roboshop-ai, mrjithendar/tools, mrjithendar/jithendar.com]}
  knowledge_sources:
    - name: moks-docs
      type: github
      config: {repository: mrjithendar/moks, include: ["docs/**", "lab/**", "backend/moks/skills/**"], sync_interval_minutes: 360}

# Half the chart's CPU requests, on nodes with about 440m unrequested between them. A meshed pod
# costs 70m (50m plus a 20m sidecar), and two API replicas would leave no room for the extra pod a
# rollout starts, so it would hang. Limits stay, so idle headroom is still used.
api:
  replicas: 1
  resources:
    requests: {cpu: 50m}
worker:
  replicas: 1
  resources:
    requests: {cpu: 50m}

ingress:
  enabled: false

istio:
  enabled: true
  gateway: istio-ingress/public   # tools/eks-argocd/roboshop-demo/ingress
  host: eks.jithendar.com
  mtls: true
  gatewayPrincipal: cluster.local/ns/istio-ingress/sa/istio-ingressgateway

postgres:
  bundled: true         # on the default gp3-encrypted StorageClass, which retains the volume
  storage: 10Gi
  resources:
    requests: {cpu: 50m}

# A shared Pinecone index would mix these vectors with mk4's. Keyword-only until an index is chosen.
rag:
  backend: postgres

executor:
  enabled: true
  namespaces: []        # add namespaces only when you want MOKS to act there; also add them to deploy/argocd/eks/project.yaml

databaseBackups:
  enabled: true
  namespaces: [moks, roboshop-ai]

diagnostics:
  enabled: true
  namespace: moks-diagnostics

# Off: session isolation depends on NetworkPolicy, which this cluster does not enforce (below).
terminal:
  enabled: false

# Written for when enforcement is turned on: the VPC CNI runs with --enable-network-policy=false,
# so today these are not applied.
networkPolicy:
  ingressNamespaces: [istio-ingress]
  metricsNamespaces: [monitoring]
  apiServer:
    cidrs: [172.20.0.1/32, 10.0.0.0/16]   # kubernetes Service VIP and the VPC, where the control-plane ENIs rotate
    ports: [443]
  inCluster:
    - namespace: istio-system
      ports: [80, 15012]   # kiali-prometheus, istiod for the sidecars
