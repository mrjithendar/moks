{{- if .Values.rbac.create }}
# Read-only access for the in-cluster Kubernetes connector. Deliberately excludes Secrets,
# ConfigMap contents, pods/exec, pods/attach, pods/portforward and every write verb.
# MOKS's own RBAC and environment scope narrow this further per user.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: moks-reader
  labels: {{- include "moks.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, events, namespaces, nodes, persistentvolumeclaims, replicationcontrollers]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  {{- if .Values.argocd.enabled }}
  # Sync status and errors. Read here, not with a Role in argocd, so project moks needs no destination there.
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
  {{- end }}
---
{{- if .Values.rbac.clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: moks-reader
  labels: {{- include "moks.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: moks-reader}
subjects: {{- include "moks.readerSubjects" . | nindent 2 }}
{{- else }}
{{- range .Values.rbac.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: moks-reader
  namespace: {{ . }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: moks-reader}
subjects: {{- include "moks.readerSubjects" $ | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.velero.enabled }}
---
# Created here too, so moks-portal and the velero app can sync in either order. Never pruned: it
# holds backups' Secrets and Velero's state.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.velero.namespace }}
  labels: {{- include "moks.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
# Velero's own status objects, and nothing else in its namespace: never its Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: moks-velero-reader
  namespace: {{ .Values.velero.namespace }}
  labels: {{- include "moks.labels" . | nindent 4 }}
rules:
  - apiGroups: [velero.io]
    resources: [backups, restores, schedules, backupstoragelocations]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: moks-velero-reader
  namespace: {{ .Values.velero.namespace }}
  labels: {{- include "moks.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: moks-velero-reader}
subjects: {{- include "moks.readerSubjects" . | nindent 2 }}
{{- end }}
