{{- if .Values.executor.enabled }}
# The executor is the only MOKS component with write credentials: its own ServiceAccount, bound
# per namespace (executor.namespaces) to exactly what the allowlisted actions need. The API and
# worker ServiceAccount (moks) stays read-only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moks-executor
  labels: {{- include "moks.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.componentAnnotations.executor }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: moks-executor
  labels: {{- include "moks.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, update, patch]       # restart, scale, rollback, resources, reviewed patch
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list]                             # rollback source and validation
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, patch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list]                             # rollout validation
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]                                # delete_pod: controller-managed pods, UID precondition
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
---
# Reads the kube-system UID only, to prove it is writing to the cluster a plan was approved for.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: moks-executor-cluster-identity
  labels: {{- include "moks.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: moks-executor-cluster-identity
  labels: {{- include "moks.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: moks-executor-cluster-identity}
subjects:
  - {kind: ServiceAccount, name: moks-executor, namespace: {{ .Release.Namespace }}}
{{- range .Values.executor.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: moks-executor
  namespace: {{ . }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: moks-executor}
subjects:
  - {kind: ServiceAccount, name: moks-executor, namespace: {{ $.Release.Namespace }}}
{{- end }}
{{- if .Values.velero.enabled }}
---
# Velero objects, plus create or overwrite on the Secrets MOKS itself writes. No get or list:
# the executor can put a Secret there and can never read one back.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: moks-executor-velero
  namespace: {{ .Values.velero.namespace }}
  labels: {{- include "moks.labels" . | nindent 4 }}
rules:
  - apiGroups: [velero.io]
    resources: [backups, restores, schedules, backupstoragelocations]
    verbs: [get, list, create, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [moks-r2-credentials, moks-r2-sse]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: moks-executor-velero
  namespace: {{ .Values.velero.namespace }}
  labels: {{- include "moks.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: moks-executor-velero}
subjects:
  - {kind: ServiceAccount, name: moks-executor, namespace: {{ .Release.Namespace }}}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moks-executor
  labels: {{- include "moks.labels" . | nindent 4 }}
    app.kubernetes.io/component: executor
spec:
  replicas: {{ .Values.executor.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: moks, component: executor}
  template:
    metadata:
      labels: {app: moks, component: executor}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: moks-executor
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "moks.podSecurity" . | nindent 6 }}
      terminationGracePeriodSeconds: 240     # let an in-flight action finish validating
      {{- include "moks.migrateInit" (dict "root" . "component" "executor") | nindent 6 }}
      containers:
        - name: executor
          image: {{ include "moks.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [executor]
          ports: [{name: metrics, containerPort: 9464}]
          {{- include "moks.env" (dict "root" . "component" "executor") | nindent 10 }}
          env:
            - {name: MOKS_PROCESS_ROLE, value: executor}
          {{- include "moks.containerSecurity" . | nindent 10 }}
          {{- include "moks.volumeMounts" (dict "root" . "component" "executor") | nindent 10 }}
          livenessProbe: {tcpSocket: {port: metrics}, periodSeconds: 20, failureThreshold: 3}
          resources: {{- toYaml .Values.executor.resources | nindent 12 }}
      {{- include "moks.volumes" (dict "root" . "component" "executor") | nindent 6 }}
{{- end }}
