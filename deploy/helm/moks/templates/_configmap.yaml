apiVersion: v1
kind: ConfigMap
metadata:
  name: moks-config
  labels: {{- include "moks.labels" . | nindent 4 }}
data:
  MOKS_ENV: {{ .Values.config.env | quote }}
  MOKS_PUBLIC_URL: {{ .Values.publicUrl | quote }}
  MOKS_BASE_PATH: {{ .Values.basePath | quote }}
  MOKS_AUTH_MODE: {{ .Values.config.authMode | quote }}
  MOKS_OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  MOKS_OIDC_CLIENT_ID: {{ .Values.config.oidcClientId | quote }}
  MOKS_OIDC_SCOPES: {{ .Values.config.oidcScopes | quote }}
  MOKS_OIDC_ALLOWED_DOMAINS: {{ .Values.config.oidcAllowedDomains | quote }}
  MOKS_OIDC_GROUPS_CLAIM: {{ .Values.config.oidcGroupsClaim | quote }}
  MOKS_OIDC_GROUP_ROLES: {{ .Values.config.oidcGroupRoles | quote }}
  MOKS_BOOTSTRAP_ADMINS: {{ .Values.config.bootstrapAdmins | quote }}
  MOKS_API_DOCS: {{ .Values.config.apiDocs | quote }}
  MOKS_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  MOKS_MAX_TOOL_CALLS: {{ .Values.config.maxToolCalls | quote }}
  MOKS_KNOWLEDGE_MAX_SEARCHES: {{ .Values.config.knowledgeMaxSearches | default 3 | quote }}
  MOKS_MAX_DURATION_SECONDS: {{ .Values.config.maxDurationSeconds | quote }}
  MOKS_MAX_QUERY_WINDOW_MINUTES: {{ .Values.config.maxQueryWindowMinutes | quote }}
  MOKS_WORKER_CONCURRENCY: {{ .Values.config.workerConcurrency | quote }}
  MOKS_COOKIE_SECURE: "true"
  MOKS_CREWAI_ENABLED: {{ .Values.crewai.enabled | quote }}
  {{- if .Values.crewai.enabled }}
  MOKS_CREWAI_TIMEOUT_SECONDS: {{ .Values.crewai.timeoutSeconds | quote }}
  MOKS_CREWAI_TOOL_TIMEOUT_SECONDS: {{ .Values.crewai.toolTimeoutSeconds | quote }}
  MOKS_CREWAI_MAX_ITERATIONS: {{ .Values.crewai.maxIterations | quote }}
  MOKS_CREWAI_MAX_TOOL_CALLS: {{ .Values.crewai.maxToolCalls | quote }}
  MOKS_CREWAI_MAX_CONCURRENT: {{ .Values.crewai.maxConcurrent | quote }}
  MOKS_CREWAI_EXCERPT_CHARS: {{ .Values.crewai.excerptChars | quote }}
  MOKS_CREWAI_LOG_LINES: {{ .Values.crewai.logLines | quote }}
  MOKS_CREWAI_HOME: /tmp/moks-crewai
  CREWAI_DISABLE_TELEMETRY: "true"
  CREWAI_DISABLE_TRACKING: "true"
  CREWAI_TRACING_ENABLED: "false"
  {{- end }}
  MOKS_ML_DISABLED: {{ .Values.ml.disabled | quote }}
  MOKS_ML_LEARNING_CAPTURE: {{ .Values.ml.learningCapture | quote }}
  MOKS_ML_LEARNING_RETENTION_DAYS: {{ .Values.ml.learningRetentionDays | quote }}
  MOKS_ML_SIMILAR_INCIDENTS_K: {{ .Values.ml.similarIncidents.k | quote }}
  MOKS_ML_SIMILAR_INCIDENTS_CANDIDATES: {{ .Values.ml.similarIncidents.candidates | quote }}
  MOKS_ML_ANOMALY_NAMESPACES: {{ .Values.ml.anomaly.namespaces | quote }}
  MOKS_ML_ANOMALY_STEP_SECONDS: {{ .Values.ml.anomaly.stepSeconds | quote }}
  MOKS_ML_ANOMALY_WINDOW_MINUTES: {{ .Values.ml.anomaly.windowMinutes | quote }}
  MOKS_ML_ANOMALY_TRAINING_DAYS: {{ .Values.ml.anomaly.trainingDays | quote }}
  MOKS_ML_ANOMALY_MIN_HISTORY_DAYS: {{ .Values.ml.anomaly.minHistoryDays | quote }}
  MOKS_ML_ANOMALY_MAX_COHORTS: {{ .Values.ml.anomaly.maxCohorts | quote }}
  MOKS_ML_ANOMALY_CONCURRENCY: {{ .Values.ml.anomaly.concurrency | quote }}
  MOKS_ML_ANOMALY_INTERVAL_MINUTES: {{ .Values.ml.anomaly.intervalMinutes | quote }}
  MOKS_ML_ANOMALY_MAX_FLAGS_PER_DAY: {{ .Values.ml.anomaly.maxFlagsPerDay | quote }}
  MOKS_ML_ARTIFACT_STORE: {{ .Values.ml.artifactStore | quote }}
  {{- if eq .Values.ml.artifactStore "s3" }}
  MOKS_ML_ARTIFACT_BUCKET: {{ required "ml.artifactStore s3 needs ml.artifactBucket" .Values.ml.artifactBucket | quote }}
  MOKS_ML_ARTIFACT_ENDPOINT: {{ .Values.ml.artifactEndpoint | quote }}
  MOKS_ML_ARTIFACT_REGION: {{ .Values.ml.artifactRegion | quote }}
  {{- end }}
  {{- if .Values.databaseBackups.enabled }}
  MOKS_DATABASE_BACKUP_NAMESPACES: {{ join "," .Values.databaseBackups.namespaces | quote }}
  {{- end }}
  MOKS_RAG_BACKEND: {{ has .Values.rag.backend (list "opensearch" "pinecone") | ternary .Values.rag.backend "postgres" | quote }}
  {{- if eq .Values.rag.backend "opensearch" }}
  {{- if .Values.rag.opensearch.secure.active }}
  MOKS_OPENSEARCH_URL: "https://moks-search:9200"
  MOKS_OPENSEARCH_CLUSTER: {{ .Values.rag.opensearch.secure.cluster | quote }}
  MOKS_OPENSEARCH_CA_FILE: /var/run/moks-search/ca.crt
  {{- with .Values.rag.opensearch.secure.snapshots }}
  {{- if .enabled }}
  MOKS_OPENSEARCH_SNAPSHOT_REPOSITORY: {{ .repository | quote }}
  MOKS_OPENSEARCH_SNAPSHOT_POLICY: {{ .policy | quote }}
  {{- end }}
  {{- end }}
  {{- else }}
  MOKS_OPENSEARCH_URL: {{ .Values.rag.opensearch.url | default "http://moks-opensearch:9200" | quote }}
  {{- end }}
  {{- with .Values.rag.opensearch.awsRegion }}
  MOKS_OPENSEARCH_AWS_REGION: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.reranker.enabled }}
  MOKS_RAG_RERANK_ENABLED: {{ .Values.reranker.client.enabled | quote }}
  MOKS_RAG_RERANK_URL: "http://moks-reranker.{{ .Release.Namespace }}.svc.cluster.local:8090"
  MOKS_RAG_RERANK_MODEL: {{ .Values.reranker.model.id | quote }}
  MOKS_RAG_RERANK_REVISION: {{ .Values.reranker.model.revision | quote }}
  MOKS_RAG_RERANK_CANDIDATES: {{ .Values.reranker.client.candidates | quote }}
  MOKS_RAG_RERANK_RESULTS: {{ .Values.reranker.client.results | quote }}
  MOKS_RAG_RERANK_TIMEOUT_MS: {{ .Values.reranker.client.timeoutMs | quote }}
  MOKS_RAG_RERANK_MAX_QUERY_CHARS: {{ .Values.reranker.client.maxQueryChars | quote }}
  MOKS_RAG_RERANK_MAX_PASSAGE_CHARS: {{ .Values.reranker.client.maxPassageChars | quote }}
  {{- end }}
  {{- if eq .Values.rag.backend "pinecone" }}
  MOKS_PINECONE_CLOUD: {{ .Values.rag.pinecone.cloud | quote }}
  MOKS_PINECONE_REGION: {{ .Values.rag.pinecone.region | quote }}
  {{- end }}
  MOKS_DIAGNOSTICS_NAMESPACE: {{ .Values.diagnostics.namespace | quote }}
  MOKS_ALERT_POLL_SECONDS: {{ .Values.config.alertPollSeconds | quote }}
  MOKS_DATABASE_VOLUME_GIB: {{ trimSuffix "Gi" .Values.postgres.storage | quote }}
  {{- if .Values.customSkills }}
  MOKS_SKILLS_DIR: /etc/moks-skills
  {{- end }}
  {{- with .Values.config.otelEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  MOKS_TRACE_SAMPLE_RATIO: {{ $.Values.config.traceSampleRatio | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: moks-seed
  labels: {{- include "moks.labels" . | nindent 4 }}
data:
  seed.yaml: |
{{ toYaml .Values.seed | indent 4 }}
{{- if .Values.customSkills }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: moks-skills
  labels: {{- include "moks.labels" . | nindent 4 }}
data:
  {{- range $name, $body := .Values.customSkills }}
  {{ $name }}.skill.md: {{ $body | quote }}
  {{- end }}
{{- end }}
