{{- if .Values.ingress.enabled }}
# Prefix match on the base path WITHOUT prefix stripping: MOKS serves the SPA, API, SSE and
# auth callbacks under {{ .Values.basePath }} itself. A Prefix rule on /moks also matches /moks/...,
# and Traefik prefers it over the site's "/" rule because it is longer.
# No compress middleware here: compression can buffer Server-Sent Events.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moks
  labels: {{- include "moks.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- with .Values.ingress.annotations }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host }}]
      {{- with .Values.ingress.tlsSecretName }}
      secretName: {{ . }}
      {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- if .Values.terminal.enabled }}
          # Longer, so it wins over the rule below. Traefik carries the WebSocket upgrade as is.
          - path: {{ .Values.basePath }}/api/terminal
            pathType: Prefix
            backend: {service: {name: moks-terminal, port: {name: http}}}
          {{- end }}
          - path: {{ .Values.basePath }}
            pathType: Prefix
            backend: {service: {name: moks-api, port: {name: http}}}
{{- if .Values.ingress.httpRedirect }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  labels: {{- include "moks.labels" . | nindent 4 }}
spec:
  redirectScheme: {scheme: https, permanent: true}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moks-http
  labels: {{- include "moks.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-https-redirect@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.basePath }}
            pathType: Prefix
            backend: {service: {name: moks-api, port: {name: http}}}
{{- end }}
{{- end }}
