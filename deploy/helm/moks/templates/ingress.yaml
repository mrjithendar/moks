{{- if include "moks.inGroup" (dict "root" . "group" "routing") }}
{{- if .Values.ingress.enabled }}
{{- if .Values.istio.enabled }}{{ fail "ingress.enabled and istio.enabled both route the portal; pick one" }}{{ end }}
# A plain Ingress for clusters with an ingress controller (mk4 and EKS use istio.enabled instead). Prefix match on the
# base path WITHOUT prefix stripping: MOKS serves the SPA, API, SSE and auth callbacks under {{ .Values.basePath }}
# itself. Do not let the controller compress responses: compression can buffer Server-Sent Events.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moks
  labels: {{- include "moks.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts: [{{ .Values.ingress.host }}]
      {{- with .Values.ingress.tlsSecretName }}
      secretName: {{ . }}
      {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- if .Values.terminal.enabled }}
          # Longer, so it wins over the rule below. The WebSocket upgrade must pass through as is.
          - path: {{ .Values.basePath }}/api/terminal
            pathType: Prefix
            backend: {service: {name: moks-terminal, port: {name: http}}}
          {{- end }}
          - path: {{ .Values.basePath }}
            pathType: Prefix
            backend: {service: {name: moks-api, port: {name: http}}}
{{- end }}
{{- end }}
