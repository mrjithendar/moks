{{- with .Values.rag.opensearch.dashboards }}
{{- if and .enabled $.Values.ingress.enabled (eq $.Values.rag.backend "opensearch") (not $.Values.rag.opensearch.url) }}
{{- if include "moks.inGroup" (dict "root" $ "group" "opensearch") }}
# Web UI for the bundled pod. Settings are env vars, not a mounted file: the image's entrypoint rewrites
# opensearch_dashboards.yml when it drops the security plugin, so that file has to stay writable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moks-opensearch-dashboards
  labels: {{- include "moks.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector: {matchLabels: {app: moks-opensearch-dashboards}}
  template:
    metadata: {labels: {app: moks-opensearch-dashboards}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: dashboards
          image: {{ .image }}
          env:
            - {name: OPENSEARCH_HOSTS, value: '["http://moks-opensearch:9200"]'}
            - {name: SERVER_BASEPATH, value: {{ .path | quote }}}
            - {name: SERVER_REWRITEBASEPATH, value: "true"}
            - {name: DISABLE_SECURITY_DASHBOARDS_PLUGIN, value: "true"}   # the pod has no security plugin to talk to
            - {name: NODE_OPTIONS, value: "--max-old-space-size=768"}
          ports: [{name: http, containerPort: 5601}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: {{ .path }}/api/status, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: {{ .path }}/api/status, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: moks-opensearch-dashboards
spec:
  selector: {app: moks-opensearch-dashboards}
  ports: [{name: http, port: 5601, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: moks-opensearch-dashboards
spec:
  podSelector: {matchLabels: {app: moks-opensearch-dashboards}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range $.Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ . }}}}
        {{- end }}
      ports: [{port: 5601, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{podSelector: {matchLabels: {app: moks-opensearch}}}]
      ports: [{port: 9200, protocol: TCP}]
{{- end }}
{{- if include "moks.inGroup" (dict "root" $ "group" "routing") }}
---
# Its own login, not the API's: Dashboards reaches OpenSearch directly, so this login can write and delete.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: opensearch-dashboards-auth
  labels: {{- include "moks.labels" $ | nindent 4 }}
spec:
  basicAuth:
    secret: {{ .authSecret }}
    removeHeader: true
---
# No prefix stripping: Dashboards serves everything under its base path itself. A missing Secret leaves
# this router out, so the path shows the site's 404.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opensearch-dashboards
  labels: {{- include "moks.labels" $ | nindent 4 }}
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`{{ $.Values.ingress.host }}`) && (Path(`{{ .path }}`) || PathPrefix(`{{ .path }}/`))
      middlewares:
        - name: opensearch-dashboards-auth
      services:
        - name: moks-opensearch-dashboards
          port: http
  tls: {}
{{- end }}
{{- end }}
{{- end }}
