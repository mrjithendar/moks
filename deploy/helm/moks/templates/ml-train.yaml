{{- if include "moks.inGroup" (dict "root" . "group" "worker") }}
{{- if .Values.ml.training.enabled }}
{{- if not .Values.ml.anomaly.namespaces }}{{ fail "ml.training.enabled needs ml.anomaly.namespaces (env:namespace pairs to train)" }}{{ end }}
# Offline anomaly training (docs/ML.md). Reads Prometheus through the automation principal, fits candidates on the
# earlier 80% of the window, evaluates on the rest and registers them. Promotes nothing; scores nothing live.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: moks-ml-train
  labels: {{- include "moks.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml-train
spec:
  schedule: {{ .Values.ml.training.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  suspend: {{ .Values.ml.training.suspend }}
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.ml.training.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app: moks, component: ml-train}   # app=moks: the NetworkPolicy allows PostgreSQL and Prometheus
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "moks.serviceAccount" (dict "root" . "component" "worker") }}
          automountServiceAccountToken: false
          enableServiceLinks: false
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "moks.podSecurity" . | nindent 10 }}
          containers:
            - name: train
              image: {{ include "moks.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: [ml, train]
              {{- include "moks.env" (dict "root" . "component" "worker") | nindent 14 }}
              {{- include "moks.containerSecurity" . | nindent 14 }}
              {{- include "moks.volumeMounts" (dict "root" . "component" "worker") | nindent 14 }}
              resources: {{- toYaml .Values.ml.training.resources | nindent 16 }}
          {{- include "moks.volumes" (dict "root" . "component" "worker") | nindent 10 }}
{{- end }}
{{- end }}
