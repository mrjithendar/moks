{{- with .Values.ecrRefresh }}
{{- if .enabled }}
# Lets the cluster's ecr-refresh CronJob (mk4: roboshop-ai/ecr-refresh, tools repo) keep the
# ecr-pull image pull secret in this namespace fresh. It can only get/patch that one Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-refresh
rules:
  - {apiGroups: [""], resources: [secrets], resourceNames: [ecr-pull], verbs: [get, patch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-refresh
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ecr-refresh}
subjects:
  - {kind: ServiceAccount, name: {{ .serviceAccount }}, namespace: {{ .namespace }}}
{{- end }}
{{- end }}
