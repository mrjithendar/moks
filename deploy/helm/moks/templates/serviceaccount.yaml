{{- if and .Values.serviceAccount.create (not .Values.secrets.split) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels: {{- include "moks.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.serviceAccount.create .Values.secrets.split }}
{{- range $component := list "api" "worker" "migrate" "backup" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moks-{{ $component }}
  labels: {{- include "moks.labels" $ | nindent 4 }}
  {{- with (index $.Values.serviceAccount.componentAnnotations $component) }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if or (eq $component "migrate") (eq $component "backup") }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- end }}
