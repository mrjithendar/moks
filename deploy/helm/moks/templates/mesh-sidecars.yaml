{{- if include "moks.inGroup" (dict "root" . "group" "foundation") }}
{{- if .Values.mesh.enabled }}
{{- if .Values.istio.mtls }}
{{- fail "mesh.enabled and istio.mtls both render PeerAuthentication default; pick one (values.yaml, mesh)" }}
{{- end }}
# Sidecars without the istio.mtls deny-by-default policies (mk4). The namespace label istio-injection=enabled (Argo CD app moks-foundation)
# injects them, and the istio-cni agent (miniKube repository) redirects their traffic, so Pod Security
# "baseline" admits them. Pods without a sidecar, and clients outside the mesh, can no longer connect, except
# to the ports listed below.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  labels: {{- include "moks.labels" . | nindent 4 }}
spec:
  mtls:
    mode: STRICT
{{- /* Ports that still take plain text from outside the mesh: :9464 unless mesh.metricsMtls (Prometheus scrapes
       through its own sidecar), and unless mesh.edgeMtls the ports an edge outside the mesh routes to (8080 api and
       terminal, 9200 and 5601 the OpenSearch routes). The Istio ingress gateway sends mTLS. All four are always
       rendered, with no port exception once both are true: Argo CD never prunes here, so a policy that stopped
       rendering would stay live with its old exceptions. Two PeerAuthentications on one selector conflict. */}}
{{- $edge := not .Values.mesh.edgeMtls }}
{{- $metrics := ternary (list) (list 9464) .Values.mesh.metricsMtls }}
{{- $plain := list (dict "name" "moks-metrics" "app" "moks" "ports" (ternary (append $metrics 8080) $metrics $edge))
                   (dict "name" "moks-reranker-metrics" "app" "moks-reranker" "ports" $metrics)
                   (dict "name" "moks-opensearch-edge" "app" "moks-opensearch" "ports" (ternary (list 9200) (list) $edge))
                   (dict "name" "moks-opensearch-dashboards-edge" "app" "moks-opensearch-dashboards" "ports" (ternary (list 5601) (list) $edge)) }}
{{- range $plain }}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ .name }}
  labels: {{- include "moks.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels: {app: {{ .app }}}
  mtls:
    mode: STRICT
  {{- with .ports }}
  portLevelMtls:
    {{- range . }}
    {{ . }}:
      mode: PERMISSIVE
    {{- end }}
  {{- end }}
{{- end }}
{{- with .Values.mesh.authorization }}
{{- if .enabled }}
---
# Only these callers' workloads (their mTLS identity) reach anything in this namespace: its own pods and
# mesh.authorization.namespaces (the ingress gateway, Prometheus/Grafana). dryRun: Envoy only counts what it would
# refuse (miniKube scripts/istio/authz-dry-run-report.py); set false once the counts stay at 0.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-known-callers
  labels: {{- include "moks.labels" $ | nindent 4 }}
  {{- if .dryRun }}
  annotations:
    istio.io/dry-run: "true"
  {{- end }}
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: {{ toJson (prepend .namespaces $.Release.Namespace) }}
{{- end }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# Adds the sidecar's own traffic to the pods the other NetworkPolicies here already isolate. Only those
# pods: selecting one that has no policy would cut off everything else it does.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: istio-sidecars
  labels: {{- include "moks.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [moks, moks-postgres, moks-opensearch, moks-opensearch-dashboards, moks-reranker, moks-search, moks-search-dashboards]
  policyTypes: [Ingress, Egress]
  ingress:
    # 15020: health checks and merged metrics; 15090: Envoy's own (Prometheus job envoy-stats).
    - from:
        {{- range .Values.networkPolicy.metricsNamespaces }}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ . }}}}
        {{- end }}
      ports: [{port: 15020, protocol: TCP}, {port: 15090, protocol: TCP}]
  egress:
    # The proxy finds istiod by name (istiod.istio-system.svc). Postgres, OpenSearch and the reranker have no
    # DNS rule of their own, so without this their proxies never start, and neither do they.
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    # Configuration and certificates from istiod. Without them the proxy never gets ready, and with
    # holdApplicationUntilProxyStarts the application never starts.
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.mesh.istiodNamespace }}}}}]
      ports: [{port: 15012, protocol: TCP}]
{{- end }}
{{- end }}
{{- end }}
