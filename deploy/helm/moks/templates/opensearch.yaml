{{- if eq .Values.rag.backend "opensearch" }}
# Phase 2 RAG store. Single node, security plugin on, persistent volume. Memory: JVM heap
# (rag.opensearch.heapSize) plus the same again for Lucene file cache; 1g heap -> 2Gi limit.
{{- $heap := .Values.rag.opensearch.heapSize }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: moks-opensearch
  labels: {{- include "moks.labels" . | nindent 4 }}
spec:
  serviceName: moks-opensearch
  replicas: 1
  selector: {matchLabels: {app: moks-opensearch}}
  template:
    metadata: {labels: {app: moks-opensearch}}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.rag.opensearch.nodeName }}
      nodeSelector: {kubernetes.io/hostname: {{ . }}}
      {{- end }}
      securityContext: {fsGroup: 1000, runAsUser: 1000, runAsNonRoot: true}
      {{- if .Values.rag.opensearch.fixVolumePermissions }}
      # hostPath volumes (minikube) ignore fsGroup and arrive root-owned, so OpenSearch (uid 1000)
      # cannot create data/nodes. Hand the volume to uid 1000 once; root here, but only CHOWN/FOWNER.
      initContainers:
        - name: volume-permissions
          image: {{ .Values.rag.opensearch.image }}
          # Not the real mount path: /usr/share/opensearch is closed to root without DAC_READ_SEARCH.
          command: [sh, -c, "chown 1000:1000 /mnt/data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [CHOWN, FOWNER]}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
          volumeMounts: [{name: data, mountPath: /mnt/data}]
      {{- end }}
      containers:
        - name: opensearch
          image: {{ .Values.rag.opensearch.image }}
          env:
            - {name: discovery.type, value: single-node}
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms{{ $heap }} -Xmx{{ $heap }}"}
            - {name: bootstrap.memory_lock, value: "false"}
            - {name: node.store.allow_mmap, value: "false"}      # no vm.max_map_count tuning needed on the nodes
            # Reachable only from MOKS pods (NetworkPolicy below); plain HTTP inside the namespace.
            - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
            - {name: DISABLE_INSTALL_DEMO_CONFIG, value: "true"}
          ports: [{name: http, containerPort: 9200}]
          resources:
            requests: {cpu: 250m, memory: 2Gi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts: [{name: data, mountPath: /usr/share/opensearch/data}]
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations: {argocd.argoproj.io/sync-options: "Prune=false,Delete=false"}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.rag.opensearch.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: moks-opensearch
spec:
  selector: {app: moks-opensearch}
  ports: [{name: http, port: 9200, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: moks-opensearch
spec:
  podSelector: {matchLabels: {app: moks-opensearch}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: moks}}}]
      ports: [{port: 9200, protocol: TCP}]
  egress: []
{{- else if not (has .Values.rag.backend (list "postgres" "pgvector" "pinecone")) }}
{{- fail "rag.backend must be postgres, pgvector, opensearch or pinecone (only one backend at a time)" }}
{{- end }}
