# Add to the Prometheus scrape_configs in the tools repository (observability/prometheus),
# next to the jithendar-com job. The headless Service moks-metrics resolves to every MOKS pod.
- job_name: moks
  metrics_path: /metrics
  dns_sd_configs:
    - names: [moks-metrics.moks.svc.cluster.local]
      type: A
      port: 9464
  relabel_configs:
    - {target_label: service, replacement: moks}

# moks-search, once its image has the exporter (docs/OPENSEARCH.md). The worker's moks_search_backend gauges
# need only the job above. This one needs the moks_monitor password and the CA in a Secret mounted into
# Prometheus, and NetworkPolicy already allows the monitoring namespace. It carries no document text.
- job_name: moks-search
  scheme: https
  metrics_path: /_prometheus/metrics
  basic_auth:
    username: moks_monitor
    password_file: /etc/prometheus/moks-search/monitor-password
  tls_config:
    ca_file: /etc/prometheus/moks-search/ca.crt
    server_name: moks-search
  static_configs:
    - targets: [moks-search.moks.svc.cluster.local:9200]
