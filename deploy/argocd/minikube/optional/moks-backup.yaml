# The moks-backup CronJob and its script ConfigMap. Move this file to ../apps/ when
# backup.enabled is true, and not before.
# Manual sync, never with prune (docs/ARGOCD_APP_SPLIT.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: moks-backup
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: moks
  source:
    repoURL: https://github.com/mrjithendar/moks.git
    targetRevision: master
    path: deploy/helm/moks
    helm:
      releaseName: moks
      valueFiles: [values-minikube.yaml]
      parameters:
        - {name: resourceGroup, value: backup}
  destination:
    server: https://kubernetes.default.svc
    namespace: moks
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - FailOnSharedResource=true
