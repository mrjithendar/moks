# Bundled OpenSearch, because rag.backend is opensearch with no rag.opensearch.url. Move this file back to
# ../optional/ when that changes. Amazon OpenSearch Service and Pinecone are never Applications.
# Manual sync, never with prune (docs/ARGOCD_APP_SPLIT.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: moks-opensearch
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: moks
  source:
    repoURL: https://github.com/mrjithendar/moks.git
    targetRevision: master
    path: deploy/helm/moks
    helm:
      releaseName: moks
      valueFiles: [values-hetzner.yaml]
      parameters:
        - {name: resourceGroup, value: opensearch}
  destination:
    server: https://kubernetes.default.svc
    namespace: moks
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - FailOnSharedResource=true
