# Owns moks-config, moks-seed and moks-skills; shared ServiceAccounts, RBAC, moks-metrics and the
# moks NetworkPolicy. The only Application that sets namespace metadata, and the only one with
# CreateNamespace.
# Manual sync, never with prune (docs/ARGOCD_APP_SPLIT.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-demo-moks-foundation
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: moks-eks
  source:
    repoURL: https://github.com/mrjithendar/moks.git
    targetRevision: master
    path: deploy/helm/moks
    helm:
      releaseName: moks
      valueFiles: [values-eks.yaml]
      parameters:
        - {name: resourceGroup, value: foundation}
  destination:
    name: roboshop-demo
    namespace: moks
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - FailOnSharedResource=true
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: moks
        istio-injection: enabled
        # istio-init needs NET_ADMIN to redirect traffic, which baseline refuses, and this cluster
        # has no Istio CNI. The chart's own containers still drop all capabilities.
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/warn: restricted
