# Bundled OpenSearch. Move this file to ../apps/ when rag.backend is opensearch without
# rag.opensearch.url, and not before. Amazon OpenSearch Service and Pinecone are never Applications.
# Manual sync, never with prune (docs/ARGOCD_APP_SPLIT.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-demo-moks-opensearch
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: moks-eks
  source:
    repoURL: https://github.com/mrjithendar/moks.git
    targetRevision: master
    path: deploy/helm/moks
    helm:
      releaseName: moks
      valueFiles: [values-eks.yaml]
      parameters:
        - {name: resourceGroup, value: opensearch}
  destination:
    name: roboshop-demo
    namespace: moks
  syncPolicy:
    syncOptions:
      - PruneLast=true
      - FailOnSharedResource=true
