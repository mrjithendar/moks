# The terminal gateway, session identities and the moks-terminals namespace with its quota and
# default-deny NetworkPolicy. Optional: apply this file by hand, once docs/TERMINAL.md's steps are done.
# Manual sync, never with prune (docs/ARGOCD_APP_SPLIT.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-demo-moks-terminal
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: moks-eks
  source:
    repoURL: https://github.com/mrjithendar/moks.git
    targetRevision: master
    path: deploy/helm/moks
    helm:
      releaseName: moks
      valueFiles: [values-eks.yaml]
      parameters:
        - {name: resourceGroup, value: terminal}
  destination:
    name: roboshop-demo
    namespace: moks
  syncPolicy:
    syncOptions:
      - PruneLast=true
      - FailOnSharedResource=true
