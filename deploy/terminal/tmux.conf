# tmux is here so a dropped connection does not kill the shell. Everything else about it is hidden.
set -g status off
set -g prefix None
unbind-key -a
set -g escape-time 0
set -g history-limit 20000
set -g default-terminal "xterm-256color"
set -g default-command "bash --rcfile /etc/moks-bashrc"
set -g exit-empty on
set -g exit-unattached off
# No alternate screen, so scrollback and selection stay in the browser's terminal.
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'
