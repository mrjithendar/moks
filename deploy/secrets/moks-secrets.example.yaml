# TEMPLATE ONLY - no real values. Create the real Secrets with scripts/create-secrets.sh,
# never commit them (.gitignore excludes *-secret.yaml and *.secret.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: moks-secrets
  namespace: moks
type: Opaque
stringData:
  MOKS_DATABASE_URL: postgresql+asyncpg://moks:<postgres-password>@moks-postgres:5432/moks
  MOKS_SESSION_SECRET: <at least 32 random characters>
  MOKS_OIDC_CLIENT_SECRET: ""            # oidc mode only
  # Connector / LLM credentials, referenced from the admin UI as {"type": "env", "name": ...}
  # MOKS_CRED_OPENAI_API_KEY: <key>
  # MOKS_CRED_GEMINI_API_KEY: <key>
  # Bedrock: no key; use IRSA/Pod Identity (EKS) or a mounted AWS profile.
---
apiVersion: v1
kind: Secret
metadata:
  name: moks-postgres
  namespace: moks
type: Opaque
stringData:
  password: <postgres-password>         # must match MOKS_DATABASE_URL
---
# Optional: file credentials (e.g. a kubeconfig for a remote cluster), mounted at
# /var/run/moks-credentials and referenced as {"type": "file", "path": "<key>"}.
apiVersion: v1
kind: Secret
metadata:
  name: moks-credentials
  namespace: moks
type: Opaque
stringData:
  example-kubeconfig: <kubeconfig contents>
