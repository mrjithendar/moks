# Credentials for OpenSearch snapshots. Use an R2 API token scoped to the one snapshot bucket, not the
# MOKS_CRED_R2_* keys, which also reach MOKS's database and cluster backups.
apiVersion: v1
kind: Secret
metadata:
  name: moks-search-snapshots
  namespace: moks
type: Opaque
stringData:
  access-key: replace-me
  secret-key: replace-me
