# Service token for the internal reranker. Generate one value and use it twice: here, and as
# MOKS_CRED_RERANKER_TOKEN in moks-secrets (or the API and worker Secrets when secrets.split is true).
#   openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: moks-reranker-secrets
  namespace: moks
type: Opaque
stringData:
  MOKS_CRED_RERANKER_TOKEN: replace-me
