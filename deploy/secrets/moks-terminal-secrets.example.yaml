# Everything the terminal gateway holds. It gets no LLM keys, connector tokens or R2 keys.
# Create it from your password manager; never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: moks-terminal-secrets
  namespace: moks
type: Opaque
stringData:
  MOKS_DATABASE_URL: postgresql+asyncpg://moks_terminal:<terminal-password>@moks-postgres:5432/moks
  MOKS_SESSION_SECRET: <same value as moks-secrets>
  # mk4 only. On EKS leave these out and use terminal.gateway.serviceAccountAnnotations.
  AWS_ACCESS_KEY_ID: <key of the moks-terminal-gateway user>
  AWS_SECRET_ACCESS_KEY: <secret of the moks-terminal-gateway user>
