name: moks

# check   -> pull requests only: backend tests against PostgreSQL, frontend typecheck/build,
#            Helm lint/render, Argo CD child Applications against the chart
# terminal -> pull requests and pushes: diagnostic image build, scan and isolation test on kind
# crewai  -> pull requests: the backend suite again on the CrewAI dependency set (pydantic 2.12.5 + crewai,
#            backend/requirements-crewai.txt), which is what an image built with MOKS_CREWAI=true runs
# release -> default branch: build the arm64 image once and push it as latest, the only tag. The commit is baked in.
# release-crewai -> the same image with the CrewAI extra (MOKS_CREWAI=true), pushed as moks-crewai:latest. mk4 runs
#            it only when values-minikube.yaml points image.repository there (docs/crewai-investigation.md).
# deploy  -> after release, only when repository variable MK4_DEPLOY is "true": Argo CD deploys. CI asks it to
#            sync the MOKS Applications from master in order, then to restart the Deployments that run
#            moks:latest, and checks the site reports the new commit. CI has no Kubernetes credentials: only an
#            Argo CD token for project role moks/ci (get, sync, restart; scripts/setup-argocd-ci.sh).

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: moks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: moks, POSTGRES_PASSWORD: moks, POSTGRES_DB: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moks" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Backend tests
        working-directory: backend
        env:
          MOKS_TEST_DATABASE_URL: postgresql://moks:moks@localhost:5432/postgres
        run: |
          pip install -r requirements.txt pytest pytest-asyncio
          pip install --no-deps -e .
          python -m pytest -q
      - uses: actions/setup-node@v7
        with: {node-version: "26", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
      - uses: azure/setup-helm@v5
      - name: Helm
        run: |
          helm lint deploy/helm/moks -f deploy/helm/moks/values-minikube.yaml
          helm lint deploy/helm/moks -f deploy/helm/moks/values-eks.yaml --set image.tag=ci
          helm template moks deploy/helm/moks -n moks -f deploy/helm/moks/values-minikube.yaml > /dev/null
          helm template moks deploy/helm/moks -n moks -f deploy/helm/moks/values-minikube.yaml --set secrets.split=true,backup.enabled=true,backup.bucket=ci,velero.enabled=true > /dev/null
          helm template moks deploy/helm/moks -n moks -f deploy/helm/moks/values-eks.yaml --set image.tag=ci,secrets.split=true > /dev/null
      - name: Argo CD Applications add up to the chart
        run: |
          pip install pyyaml
          python scripts/validate-argocd-split.py
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  # The diagnostic image on both architectures, its vulnerability scan, and real isolation checks on
  # kind, which runs the same network plugin as mk4. Runs when something the terminal depends on changes.
  terminal:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: azure/setup-helm@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build
        run: docker buildx build --load -t moks-terminal:test deploy/terminal
      - name: Runs read-only, unprivileged, with every tool present
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --user 10002:10002 moks-terminal:test \
            bash -c 'aws --version && kubectl version --client && curl --version | head -1 && jq --version && dig -v && tmux -V && test "$(id -u)" = 10002'
      - name: The shell survives detaching, as a reconnect needs
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --user 10002:10002 -e HOME=/tmp/home -e TMUX_TMPDIR=/tmp moks-terminal:test bash -c '
            tmux -u new-session -d -s moks && sleep 1 && tmux send-keys -t moks "echo still-$((40+2))" Enter && sleep 1
            tmux capture-pane -p -t moks | grep -q still-42 && tmux has-session -t moks'
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          image-ref: moks-terminal:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: deploy/terminal/.trivyignore
      - uses: helm/kind-action@v1
        with: {cluster_name: kind, config: deploy/terminal/kind-isolation.yaml}
      - name: Isolation on a real cluster
        env:
          IMAGE: moks-terminal:test
        run: |
          pip install -r backend/requirements.txt
          pip install --no-deps -e backend
          scripts/terminal-isolation-test.sh

  release:
    needs: check
    # check is skipped on a push, and a skipped need would skip this job too, so that case is allowed here.
    if: ${{ !cancelled() && needs.check.result == 'skipped' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      REGISTRY: registry.jithendar.com/jithendar
      REPOSITORY: moks
    steps:
      - uses: actions/checkout@v7
      # Harbor robot robot$jithendar+moks (push and pull in project jithendar only), set as these repository secrets
      # by tools deploy/minikube/harbor/registry.py ci-robots.
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin
      - name: Build, smoke-test and push
        run: |
          # One tag, latest. The commit is inside the image (GIT_COMMIT, reported by /moks/api/health), not in the tag.
          IMAGE="$REGISTRY/$REPOSITORY:latest"
          docker build --build-arg GIT_COMMIT=${{ github.sha }} -t "$IMAGE" .
          # The image must start and answer its probes without a database (readyz reports 503).
          docker run -d --name smoke -e MOKS_ENV=development -e MOKS_AUTH_MODE=local -p 8080:8080 "$IMAGE"
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/moks/ | grep -q '<div id="root">'
          curl -fsS localhost:8080/moks/api/health | grep -q '${{ github.sha }}'
          docker rm -f smoke
          docker push "$IMAGE"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)"
          echo "pushed $IMAGE (commit ${{ github.sha }}, $DIGEST). The deploy job restarts mk4 when MK4_DEPLOY is true; see docs/RELEASES.md." >> "$GITHUB_STEP_SUMMARY"
          # The release record: which commit became which digest (docs/RELEASES.md).
          mkdir -p release && printf '{"component":"moks","commit":"%s","repository":"%s","tag":"%s","digest":"%s","run":"%s"}\n' \
            "${{ github.sha }}" "$REPOSITORY" latest "$DIGEST" "${{ github.run_id }}" > release/moks.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-moks-${{ github.sha }}
          path: release/moks.json
          retention-days: 400

  release-crewai:
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'skipped' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REGISTRY: registry.jithendar.com/jithendar
      REPOSITORY: moks-crewai
    steps:
      - uses: actions/checkout@v7
      # Harbor robot robot$jithendar+moks (push and pull in project jithendar only), set as these repository secrets
      # by tools deploy/minikube/harbor/registry.py ci-robots.
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin
      - name: Build, smoke-test and push
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:latest"
          docker build --build-arg GIT_COMMIT=${{ github.sha }} --build-arg MOKS_CREWAI=true -t "$IMAGE" .
          # As in the pods: read-only root, no home directory, no network. crewai must import at the pinned version
          # with its telemetry off, or the capability would report it unavailable.
          docker run --rm --read-only --tmpfs /tmp --network none --entrypoint python "$IMAGE" -c \
            'from moks.crew import PINNED, installed_version, prepare_environment; prepare_environment(); import crewai, os; assert installed_version() == PINNED, installed_version(); assert os.environ["CREWAI_DISABLE_TELEMETRY"] == "true"; print("crewai", crewai.__version__)'
          docker run -d --name smoke -e MOKS_ENV=development -e MOKS_AUTH_MODE=local -p 8080:8080 "$IMAGE"
          for _ in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/moks/api/health | grep -q '${{ github.sha }}'
          docker rm -f smoke
          docker images "$IMAGE" --format 'image size {{ .Size }}' >> "$GITHUB_STEP_SUMMARY"
          docker push "$IMAGE"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)"
          echo "pushed $IMAGE (commit ${{ github.sha }}, $DIGEST)." >> "$GITHUB_STEP_SUMMARY"
          mkdir -p release && printf '{"component":"moks-crewai","commit":"%s","repository":"%s","tag":"%s","digest":"%s","run":"%s"}\n' \
            "${{ github.sha }}" "$REPOSITORY" latest "$DIGEST" "${{ github.run_id }}" > release/moks-crewai.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-moks-crewai-${{ github.sha }}
          path: release/moks-crewai.json
          retention-days: 400

  deploy:
    # Waits for both images. Only the default one must succeed: when the CrewAI build fails, moks-crewai (the
    # CrewAI worker, the only pod on that image) is not restarted and keeps its last build, and the job says so.
    needs: [release, release-crewai]
    if: ${{ !cancelled() && needs.release.result == 'success' && vars.MK4_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: moks-deploy-mk4
      cancel-in-progress: false
    env:
      # Argo CD at https://jithendar.com/argocd. The token is project role moks/ci (deploy/argocd/minikube/project.yaml):
      # get, sync and restart Applications of project moks, nothing else. scripts/setup-argocd-ci.sh issues it.
      ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER || 'jithendar.com' }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_OPTS: --grpc-web --grpc-web-root-path /argocd
    steps:
      - name: Install the argocd CLI
        run: |
          [[ -n "$ARGOCD_AUTH_TOKEN" ]] || { echo "::error::ARGOCD_AUTH_TOKEN is not set; run scripts/setup-argocd-ci.sh"; exit 1; }
          curl -fsSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/download/v3.5.6/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd
          argocd version --client --short
      # Git first: sync every child in the order docs/ARGOCD_APP_SPLIT.md section 6 sets, so the ConfigMap
      # (foundation) is current before the pods that hash it roll. Never --prune.
      - name: Sync the MOKS Applications from master
        run: |
          set -euo pipefail
          for app in foundation database api worker crewai executor terminal routing opensearch reranker; do
            argocd app get "moks-$app" -o name > /dev/null 2>&1 || { echo "moks-$app does not exist; skipped"; continue; }
            argocd app get "moks-$app" --refresh > /dev/null
            argocd app sync "moks-$app" --timeout 600
            argocd app wait "moks-$app" --sync --health --timeout 600
          done
      # Then the image: the tag is always latest, which a sync cannot see change, so Argo CD's restart action
      # rolls the Deployments that run moks:latest (imagePullPolicy Always). The worker goes first: running
      # investigations finish within its termination grace period, and the first API pod runs pending migrations.
      - name: Restart onto the new image
        run: |
          set -euo pipefail
          for pair in worker:moks-worker api:moks-api executor:moks-executor terminal:moks-terminal; do
            app="moks-${pair%%:*}"; deploy="${pair#*:}"
            argocd app actions run "$app" restart --kind Deployment --resource-name "$deploy" --namespace moks
            argocd app wait "$app" --health --timeout 600
          done
      # moks-crewai runs moks-crewai:latest, so it restarts only when that image was pushed for this commit.
      - name: Restart the CrewAI worker onto the new image
        env:
          CREWAI_BUILD: ${{ needs.release-crewai.result }}
        run: |
          set -euo pipefail
          if [[ "$CREWAI_BUILD" != success ]]; then
            echo "::warning::the CrewAI image build was $CREWAI_BUILD; moks-crewai keeps its last image"; exit 0
          fi
          if ! argocd app get moks-crewai -o name > /dev/null 2>&1; then echo "moks-crewai does not exist; skipped"; exit 0; fi
          if ! argocd app resources moks-crewai | grep -q 'Deployment.*moks-crewai'; then echo "crewai.enabled is false: no moks-crewai Deployment"; exit 0; fi
          argocd app actions run moks-crewai restart --kind Deployment --resource-name moks-crewai --namespace moks
          argocd app wait moks-crewai --health --timeout 600
      - name: The site runs this commit
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS https://jithendar.com/moks/api/health | grep -q '${{ github.sha }}'; then
              echo "mk4 runs ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep 10
          done
          echo "::error::https://jithendar.com/moks/api/health does not report ${{ github.sha }}"; exit 1

  crewai:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: moks, POSTGRES_PASSWORD: moks, POSTGRES_DB: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moks" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Backend tests on the CrewAI dependency set
        working-directory: backend
        env:
          MOKS_TEST_DATABASE_URL: postgresql://moks:moks@localhost:5432/postgres
        run: |
          grep -v '^pydantic==' requirements.txt > /tmp/base.txt
          pip install -r /tmp/base.txt -r requirements-crewai.txt pytest pytest-asyncio
          pip install --no-deps -e .
          python -c "import crewai; print('crewai', crewai.__version__)"
          python -m pytest -q

  reranker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Service tests
        working-directory: reranker
        run: |
          pip install -r requirements-test.txt
          python -m pytest tests -q

  # Moves latest. Nothing changes live until the moks-reranker Deployment restarts.
  reranker-image:
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [reranker]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REGISTRY: registry.jithendar.com/jithendar
      REPOSITORY: moks-reranker
    steps:
      - uses: actions/checkout@v7
      # Harbor robot robot$jithendar+moks (push and pull in project jithendar only), set as these repository secrets
      # by tools deploy/minikube/harbor/registry.py ci-robots.
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin
      - name: Build, smoke-test and push
        working-directory: reranker
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:latest"
          docker build --build-arg GIT_COMMIT=${{ github.sha }} -t "$IMAGE" .
          # No network, so a runtime download would fail here rather than in production.
          docker run -d --name smoke -e RERANKER_TOKEN=ci -e RERANKER_METRICS_PORT=0 --network none --read-only --tmpfs /tmp --user 10001:10001 "$IMAGE"
          docker exec smoke python -c "
          import time, urllib.request
          for _ in range(60):
              try:
                  print(urllib.request.urlopen('http://127.0.0.1:8090/readyz').read()); break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit('never ready')
          "
          docker rm -f smoke
          docker images "$IMAGE" --format 'image size {{ .Size }}' >> "$GITHUB_STEP_SUMMARY"
          docker push "$IMAGE"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)"
          echo "pushed $IMAGE (commit ${{ github.sha }}, $DIGEST). Restart moks-reranker to run it." >> "$GITHUB_STEP_SUMMARY"
          MODEL="$(python3 -c 'import json; l=json.load(open("model.lock.json")); print(l["model_id"] + "@" + l["revision"])')"
          mkdir -p ../release && printf '{"component":"moks-reranker","commit":"%s","repository":"%s","tag":"%s","digest":"%s","model":"%s","run":"%s"}\n' \
            "${{ github.sha }}" "$REPOSITORY" latest "$DIGEST" "$MODEL" "${{ github.run_id }}" > ../release/moks-reranker.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-moks-reranker-${{ github.sha }}
          path: release/moks-reranker.json
          retention-days: 400

  # moks-search with its S3 and metrics plugins, as moks-opensearch:latest. Changes nothing until
  # rag.opensearch.secure.image points at it.
  opensearch-image:
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REGISTRY: registry.jithendar.com/jithendar
      REPOSITORY: moks-opensearch
    steps:
      - uses: actions/checkout@v7
      # Harbor robot robot$jithendar+moks (push and pull in project jithendar only), set as these repository secrets
      # by tools deploy/minikube/harbor/registry.py ci-robots.
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin
      - uses: docker/setup-buildx-action@v4
      - name: Build, smoke-test and push for arm64 and amd64
        working-directory: deploy/opensearch
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:latest"
          docker build -t smoke .
          docker run --rm smoke bin/opensearch-plugin list | tee plugins
          grep -q repository-s3 plugins && grep -q prometheus-exporter plugins
          docker buildx build --platform linux/arm64,linux/amd64 --provenance=false --metadata-file meta.json --push -t "$IMAGE" .
          echo "pushed $IMAGE ($(python3 -c "import json;print(json.load(open('meta.json'))['containerimage.digest'])"))." >> "$GITHUB_STEP_SUMMARY"

  # Built and pushed on every push to the default branch as moks-terminal:latest. Each new session pulls it.
  terminal-image:
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      REGISTRY: registry.jithendar.com/jithendar
      REPOSITORY: moks-terminal
    steps:
      - uses: actions/checkout@v7
      # Harbor robot robot$jithendar+moks (push and pull in project jithendar only), set as these repository secrets
      # by tools deploy/minikube/harbor/registry.py ci-robots.
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin
      - uses: docker/setup-buildx-action@v4
      - name: Build and push for arm64 and amd64
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:latest"
          docker buildx build --platform linux/arm64,linux/amd64 --provenance=false --build-arg GIT_COMMIT=${{ github.sha }} -t "$IMAGE" --push --metadata-file meta.json deploy/terminal
          echo "pushed $IMAGE ($(python3 -c "import json;print(json.load(open('meta.json'))['containerimage.digest'])")). New sessions run it." >> "$GITHUB_STEP_SUMMARY"
