name: moks

# check   -> pull requests only: backend tests against PostgreSQL, frontend typecheck/build,
#            Helm lint/render, Argo CD child Applications against the chart
# terminal -> pull requests and pushes: diagnostic image build, scan and isolation test on kind
# release -> default branch: build the arm64 image once, tag it with the commit and move latest to it.
#            mk4 runs latest, and new pods pull it when restarted. CI never touches the cluster.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: moks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: moks, POSTGRES_PASSWORD: moks, POSTGRES_DB: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moks" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Backend tests
        working-directory: backend
        env:
          MOKS_TEST_DATABASE_URL: postgresql://moks:moks@localhost:5432/postgres
        run: |
          pip install -r requirements.txt pytest pytest-asyncio
          pip install --no-deps -e .
          python -m pytest -q
      - uses: actions/setup-node@v7
        with: {node-version: "26", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
      - uses: azure/setup-helm@v5
      - name: Helm
        run: |
          helm lint deploy/helm/moks -f deploy/helm/moks/values-minikube.yaml
          helm lint deploy/helm/moks -f deploy/helm/moks/values-eks.yaml --set image.tag=ci
          helm template moks deploy/helm/moks -n moks -f deploy/helm/moks/values-minikube.yaml > /dev/null
          helm template moks deploy/helm/moks -n moks -f deploy/helm/moks/values-minikube.yaml --set secrets.split=true,backup.enabled=true,backup.bucket=ci,velero.enabled=true > /dev/null
          helm template moks deploy/helm/moks -n moks -f deploy/helm/moks/values-eks.yaml --set image.tag=ci,secrets.split=true > /dev/null
      - name: Argo CD Applications add up to the chart
        run: |
          pip install pyyaml
          python scripts/validate-argocd-split.py
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  # The diagnostic image on both architectures, its vulnerability scan, and real isolation checks on
  # kind, which runs the same network plugin as mk4. Runs when something the terminal depends on changes.
  terminal:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: azure/setup-helm@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build
        run: docker buildx build --load -t moks-terminal:test deploy/terminal
      - name: Runs read-only, unprivileged, with every tool present
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --user 10002:10002 moks-terminal:test \
            bash -c 'aws --version && kubectl version --client && curl --version | head -1 && jq --version && dig -v && tmux -V && test "$(id -u)" = 10002'
      - name: The shell survives detaching, as a reconnect needs
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --user 10002:10002 -e HOME=/tmp/home -e TMUX_TMPDIR=/tmp moks-terminal:test bash -c '
            tmux -u new-session -d -s moks && sleep 1 && tmux send-keys -t moks "echo still-$((40+2))" Enter && sleep 1
            tmux capture-pane -p -t moks | grep -q still-42 && tmux has-session -t moks'
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          image-ref: moks-terminal:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: deploy/terminal/.trivyignore
      - uses: helm/kind-action@v1
        with: {cluster_name: kind, config: deploy/terminal/kind-isolation.yaml}
      - name: Isolation on a real cluster
        env:
          IMAGE: moks-terminal:test
        run: |
          pip install -r backend/requirements.txt
          pip install --no-deps -e backend
          scripts/terminal-isolation-test.sh

  release:
    needs: check
    # check is skipped on a push, and a skipped need would skip this job too, so that case is allowed here.
    if: ${{ !cancelled() && needs.check.result == 'skipped' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write        # GitHub OIDC token for AWS; no stored access keys
    env:
      AWS_REGION: us-east-1
      REPOSITORY: moks
    steps:
      - uses: actions/checkout@v7
      # Role moks-github-ci from deploy/terraform (output ci_role_arn), stored as the repository
      # variable AWS_ROLE_ARN. It can push to the moks ECR repository only, and only from master.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: moks-ci-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, smoke-test and push
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$REPOSITORY:${{ github.sha }}"
          docker build --build-arg GIT_COMMIT=${{ github.sha }} -t "$IMAGE" .
          # The image must start and answer its probes without a database (readyz reports 503).
          docker run -d --name smoke -e MOKS_ENV=development -e MOKS_AUTH_MODE=local -p 8080:8080 "$IMAGE"
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/moks/ | grep -q '<div id="root">'
          curl -fsS localhost:8080/moks/api/health | grep -q '${{ github.sha }}'
          docker rm -f smoke
          docker push "$IMAGE"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)"
          LATEST="${{ steps.ecr.outputs.registry }}/$REPOSITORY:latest"
          docker tag "$IMAGE" "$LATEST"
          docker push "$LATEST"
          echo "pushed $IMAGE and $LATEST ($DIGEST). Restart mk4 to run it; see docs/RELEASES.md." >> "$GITHUB_STEP_SUMMARY"
          # The release record: which commit became which digest (docs/RELEASES.md).
          mkdir -p release && printf '{"component":"moks","commit":"%s","repository":"%s","tag":"%s","digest":"%s","run":"%s"}\n' \
            "${{ github.sha }}" "$REPOSITORY" "${{ github.sha }}" "$DIGEST" "${{ github.run_id }}" > release/moks.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-moks-${{ github.sha }}
          path: release/moks.json
          retention-days: 400

  reranker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Service tests
        working-directory: reranker
        run: |
          pip install -r requirements-test.txt
          python -m pytest tests -q

  # Moves latest. Nothing changes live until the moks-reranker Deployment restarts.
  reranker-image:
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [reranker]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      REPOSITORY: moks-reranker
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: moks-reranker-ci-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, smoke-test and push
        working-directory: reranker
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$REPOSITORY:${{ github.sha }}"
          docker build --build-arg GIT_COMMIT=${{ github.sha }} -t "$IMAGE" .
          # No network, so a runtime download would fail here rather than in production.
          docker run -d --name smoke -e RERANKER_TOKEN=ci -e RERANKER_METRICS_PORT=0 --network none --read-only --tmpfs /tmp --user 10001:10001 "$IMAGE"
          docker exec smoke python -c "
          import time, urllib.request
          for _ in range(60):
              try:
                  print(urllib.request.urlopen('http://127.0.0.1:8090/readyz').read()); break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit('never ready')
          "
          docker rm -f smoke
          docker images "$IMAGE" --format 'image size {{ .Size }}' >> "$GITHUB_STEP_SUMMARY"
          docker push "$IMAGE"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)"
          LATEST="${{ steps.ecr.outputs.registry }}/$REPOSITORY:latest"
          docker tag "$IMAGE" "$LATEST"
          docker push "$LATEST"
          echo "pushed $IMAGE and $LATEST ($DIGEST). Restart moks-reranker to run it." >> "$GITHUB_STEP_SUMMARY"
          MODEL="$(python3 -c 'import json; l=json.load(open("model.lock.json")); print(l["model_id"] + "@" + l["revision"])')"
          mkdir -p ../release && printf '{"component":"moks-reranker","commit":"%s","repository":"%s","tag":"%s","digest":"%s","model":"%s","run":"%s"}\n' \
            "${{ github.sha }}" "$REPOSITORY" "${{ github.sha }}" "$DIGEST" "$MODEL" "${{ github.run_id }}" > ../release/moks-reranker.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-moks-reranker-${{ github.sha }}
          path: release/moks-reranker.json
          retention-days: 400

  # moks-search with its S3 and metrics plugins. A digest in values moves the cluster, so this changes nothing
  # until rag.opensearch.secure.image is set to what it reports. Needs the moks-opensearch ECR repository.
  opensearch-image:
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      REPOSITORY: moks-opensearch
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: moks-opensearch-ci-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - name: Build, smoke-test and push for arm64 and amd64
        working-directory: deploy/opensearch
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$REPOSITORY:${{ github.sha }}"
          docker build -t smoke .
          docker run --rm smoke bin/opensearch-plugin list | tee plugins
          grep -q repository-s3 plugins && grep -q prometheus-exporter plugins
          docker buildx build --platform linux/arm64,linux/amd64 --provenance=false --metadata-file meta.json --push -t "$IMAGE" .
          echo "pushed $IMAGE ($(python3 -c "import json;print(json.load(open('meta.json'))['containerimage.digest'])"))." >> "$GITHUB_STEP_SUMMARY"

  # Built and pushed on every push to the default branch. Sessions run a digest, so this changes nothing
  # until the chart's terminal.image.digest is moved to what this reports.
  terminal-image:
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      REPOSITORY: moks-terminal
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: moks-ci-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - name: Build and push for arm64 and amd64
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$REPOSITORY:${{ github.sha }}"
          docker buildx build --platform linux/arm64,linux/amd64 --provenance=false --build-arg GIT_COMMIT=${{ github.sha }} -t "$IMAGE" --push --metadata-file meta.json deploy/terminal
          echo "pushed $IMAGE. Set terminal.image.digest to $(python3 -c "import json;print(json.load(open('meta.json'))['containerimage.digest'])")." >> "$GITHUB_STEP_SUMMARY"
